<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hey You</title>
  <style>
    :root {
      --bg-color: #0d0f26;
      --accent-color: #8ab4f8;
      --text-main: #ffffff;
      --text-sub: #aaddff;
      --overlay-opacity: 0.6;
      --box-bg: rgba(0, 0, 0, 0.6);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('bbb.jpeg') no-repeat center center fixed;
      background-size: cover;
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, var(--overlay-opacity));
      z-index: 0;
    }
    header, nav, section {
      position: relative; z-index: 1;
      text-align: center; padding: 6rem 2rem;
    }
    nav {
      background-color: rgba(0, 0, 0, 0.85);
      padding: 1rem; position: sticky; top: 0; z-index: 2;
    }
    nav a {
      color: var(--text-sub);
      text-decoration: none;
      margin: 0 1.2rem;
      font-size: 1.2rem;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover { color: var(--text-main); }
    header { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    header h1 { font-size: 3rem; color: var(--text-main); }
    header h2 { font-size: 2rem; color: var(--accent-color); margin-top: 0.5rem; }
    section h2 { font-size: 2.5rem; margin-bottom: 1rem; color: var(--accent-color); }
    .playlist-wrapper { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2rem; }
    .playlist-cover {
      width: 280px; height: 280px;
      background: url('bb.jpeg') center/cover no-repeat;
      border: 3px solid var(--accent-color);
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.7);
    }
    .playlist-box, .message-box {
      background-color: var(--box-bg);
      padding: 1.5rem;
      border-radius: 10px;
      max-width: 400px;
      text-align: left;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .playlist-box button {
      background: var(--accent-color);
      border: none; color: black;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      margin-top: 1rem;
      cursor: pointer;
    }
    .playlist-songs { display: none; margin-top: 1rem; }
    .playlist-songs.show { display: block; }
    ol { padding-left: 1rem; }
    .message-container {
      display: flex; justify-content: center;
      flex-wrap: wrap; gap: 2rem; margin-top: 2rem;
    }
    /* icon-button base */
    .icon-button {
      background: none; border: none; padding: 0.5rem;
      cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center;
    }
    .icon-button svg {
      width: 28px; height: 28px;
      stroke: var(--accent-color);
      fill: none; stroke-width: 2;
      transition: stroke 0.3s;
    }
    .icon-button:hover svg { stroke: var(--text-main); }

    .video-container{
      display: none; opacity: 0;
      transition: opacity 0.5s ease; margin-top: 1rem;
    }
    .video-container.show {
      display: block; opacity: 1;
    }
    .video-container video {
      width: 100%; height: auto;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .visualizer-container {
      width: 100%; overflow: hidden;
      background-color: var(--box-bg);
      border: 3px solid var(--accent-color);
      border-radius: 12px;
      margin: 20px auto; padding: 1rem;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
      position: relative;
    }
    .filmstrip { display: flex; gap: 10px; padding: 10px 0; }
    .filmstrip img {
      height: 150px; border-radius: 12px;
      border: 3px solid var(--accent-color);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.3s, border-color 0.3s;
    }
    .filmstrip img.selected {
      transform: scale(1.1); border-color: #9c27b0; z-index: 2;
    }

    .view-all-button {
      background: var(--accent-color);
      border: none; color: black;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      margin: 1.5rem auto;
      cursor: pointer;
      font-size: 1rem;
      display: block; text-align: center;
    }
    .grid-gallery { display: none; flex-wrap: wrap; gap: 10px; margin-top: 20px; justify-content: center; }
    .grid-gallery.show { display: flex; }
    .grid-gallery img {
      width: 150px; border-radius: 12px;
      border: 3px solid var(--accent-color);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
    }

    html { scroll-behavior: smooth; }
    @media (max-width: 768px) {
      .message-container { flex-direction: column; }
      .playlist-wrapper { flex-direction: column; }
      .filmstrip img { width: 180px; }
      .grid-gallery img { width: 150px; }
    }
  </style>
</head>
