<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hey You</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="#">Hey You</a>
    <a href="#home">Home</a>
    <a href="#songs">Songs</a>
    <a href="#message">Message</a>
    <a href="#visualizer">Visualizer</a>
  </nav>

  <header id="home">
    <h1>Happy Birthday 🌱</h1>
    <h2>5 May</h2>
  </header>

  <section id="songs">
    <h2>Songs</h2>
    <div class="playlist-wrapper">
      <div class="playlist-cover"></div>
      <div class="playlist-box">
        <h3>Our Vibes Playlist</h3>
        <button onclick="togglePlaylist(this)">Show Playlist</button>
        <button onclick="window.open('https://open.spotify.com/playlist/1oV15sh9IYcUzF6QyVMfqL?si=1326bc5e10994821','_blank')">Go to Spotify</button>
        <ol class="playlist-songs" id="playlist">
          <li>Serendipity</li><li>Your eyes tell</li><li>Best of me</li>
          <li>Stay alive</li><li>yours</li><li>Tomorrow</li><li>I don't know</li>
        </ol>
      </div>
    </div>
  </section>

  <section id="message">
    <h2>Message</h2>
    <div class="message-container">

      <div class="message-box">
        <button class="icon-button" onclick="toggleVideo()">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <polygon points="10,8 16,12 10,16"/>
          </svg>
        </button>
        <div class="video-container" id="videoContainer">
          <video controls>
            <source src="ays.mp4" type="video/mp4" />
          </video>
        </div>
      </div>

      <div class="message-box">
        <a href="for you.jpg" download class="icon-button" aria-label="Download Photo">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="3" x2="12" y2="15"/>
            <polyline points="5,12 12,19 19,12"/>
            <line x1="5" y1="21" x2="19" y2="21"/>
          </svg>
        </a>
      </div>

      <div class="message-box">
        <button class="icon-button" onclick="toggleVideo2()">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <polygon points="10,8 16,12 10,16"/>
          </svg>
        </button>
        <div class="video-container video-4-3" id="videoContainer2">
          <video controls>
            <source src="wish.mp4" type="video/mp4" />
          </video>
        </div>
      </div>

    </div>
  </section>

  <section id="visualizer">
    <h2>Visualizer</h2>
    <div class="visualizer-container" id="scroll-container">
      <div class="filmstrip" id="filmstrip">
        <!-- Example thumbnails -->
        <img src="pic1.jpg" alt="Memory 1" onclick="selectImage(this)">
        <img src="pic2.jpg" alt="Memory 2" onclick="selectImage(this)">
        <!-- Add more images here -->
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
